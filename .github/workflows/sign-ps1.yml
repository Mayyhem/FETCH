name: Sign Binaries

on:
  workflow_dispatch:
        
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-xbuild

      - name: Install gdb debugging for Mono
        if: runner.debug == '1'
        run: |
          sudo apt-get install -y gdb
        continue-on-error: true

      - name: Build project
        run: |
          dotnet build Sharphound.csproj -p:BuildInstaller=false -o:build_output

      - name: Move FETCH PowerShell script into output directory for signing
        run: |
          cp ./src/FETCH/FETCH.ps1 ./build_output/

      - name: List build output contents
        run: |
          echo "Contents of build_output directory:"
          ls -la ./build_output/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build_output/
          
  sign:
    needs: build
    runs-on: ubuntu-22.04 # INFO https://docs.digicert.com/en/digicert-keylocker/code-signing/sign-with-third-party-signing-tools/windows-applications/sign-authenticode-files-with-osslsigncode-using-openssl-pkcs11-engine.html#a-note-for-ubuntu-users-488674
    outputs:
      artifact-name: ${{ steps.set_artifact.outputs.artifact-name }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./build_output

      - name: List downloaded artifact contents
        run: |
          echo "Contents of downloaded build_output directory:"
          ls -la ./build_output/

      - name: Make signed output directory
        run: |
          mkdir ./signed_out

      - name: Install osslsigncode & pkcs11 engine
        run: |
          sudo apt-get update
          sudo apt-get install -y osslsigncode libengine-pkcs11-openssl

      - name: Install Java for JSign
        run: |
          sudo apt-get install -y default-jre
          
      - name: Download and setup JSign
        run: |
          # Download JSign
          wget https://github.com/ebourg/jsign/releases/download/6.0/jsign-6.0.jar -O jsign.jar
          # Verify Java is working
          java -version
          
      - name: Install PowerShell Core
        run: |
          # Update the list of packages
          sudo apt-get update
          # Install pre-requisite packages
          sudo apt-get install -y wget apt-transport-https software-properties-common
          # Download the Microsoft repository GPG keys
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          # Register the Microsoft repository GPG keys
          sudo dpkg -i packages-microsoft-prod.deb
          # Update the list of packages after we added packages.microsoft.com
          sudo apt-get update
          # Install PowerShell
          sudo apt-get install -y powershell
          # Verify installation
          pwsh --version

      - name: Install DigiCert Client Tools
        id: digicert
        uses: digicert/ssm-code-signing@v1.0.0

      - name: Set PKCS#11 Paths
        id: pkcs11
        run: |
          SM_TOOLS_DIR=$(dirname "$(realpath '${{ steps.digicert.outputs.PKCS11_CONFIG }}')")
          echo "module=${SM_TOOLS_DIR}/smpkcs11.so" >> "$GITHUB_OUTPUT"
          LIB_PKCS11="$(dpkg -L libengine-pkcs11-openssl | grep "libpkcs11.so")"
          echo "engine=$LIB_PKCS11" >> "$GITHUB_OUTPUT"

      - name: Check for files before signing
        run: |
          echo "Checking for SharpHound.exe:"
          if [ -f "build_output/SharpHound.exe" ]; then
            echo "✓ SharpHound.exe found"
          else
            echo "✗ SharpHound.exe NOT found"
            exit 1
          fi
          
          echo "Checking for FETCH.ps1:"
          if [ -f "build_output/FETCH.ps1" ]; then
            echo "✓ FETCH.ps1 found"
          else
            echo "✗ FETCH.ps1 NOT found"
            exit 1
          fi

      - name: Sign Artifacts via DigiCert Signing Manager
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          PKCS11_CONFIG: ${{ steps.digicert.outputs.PKCS11_CONFIG }}
          SM_TOOLS_PATH: ${{ steps.digicert.outputs.SM_TOOLS_PATH }}
        shell: bash
        run: |
          # Add smctl to PATH
          export PATH="${SM_TOOLS_PATH}:$PATH"
          
          # Verify smctl is available
          which smctl || (echo "smctl not found in PATH" && exit 1)
          
          export SM_CLIENT_CERT_FILE=$(mktemp)
          printenv SM_CLIENT_CERT_FILE_B64 | base64 --decode > "$SM_CLIENT_CERT_FILE"
          trap 'rm $SM_CLIENT_CERT_FILE' EXIT

          # Sign SharpHound.exe with osslsigncode
          echo "Signing SharpHound.exe with osslsigncode..."
          smctl sign --keypair-alias "${{ secrets.SM_KEYPAIR_ALIAS }}" --input "build_output/SharpHound.exe" --openssl-pkcs11-engine "${{ steps.pkcs11.outputs.engine }}" --pkcs11-module "${{ steps.pkcs11.outputs.module }}" --tool osslsigncode --verbose
          mv "build_output/SharpHound.exe" "signed_out/SharpHound.exe"
          
          # Sign FETCH.ps1 with JSign
          echo "Signing FETCH.ps1 with JSign..."
          smctl sign --keypair-alias "${{ secrets.SM_KEYPAIR_ALIAS }}" --input "build_output/FETCH.ps1" --tool jsign --jsign-jar-file ./jsign.jar --verbose
          mv "build_output/FETCH.ps1" "signed_out/FETCH.ps1"

      - name: Verify signatures
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          PKCS11_CONFIG: ${{ steps.digicert.outputs.PKCS11_CONFIG }}
          SM_TOOLS_PATH: ${{ steps.digicert.outputs.SM_TOOLS_PATH }}
        shell: bash
        run: |
          # Add smctl to PATH
          export PATH="${SM_TOOLS_PATH}:$PATH"
          
          export SM_CLIENT_CERT_FILE=$(mktemp)
          printenv SM_CLIENT_CERT_FILE_B64 | base64 --decode > "$SM_CLIENT_CERT_FILE"
          smctl certificate download --keypair-alias "${{ secrets.SM_KEYPAIR_ALIAS }}" --format pem --chain --name cert-chain.pem
          trap 'rm $SM_CLIENT_CERT_FILE cert-chain.pem' EXIT

          # Verify SharpHound.exe with osslsigncode
          echo "Verifying SharpHound.exe signature..."
          osslsigncode verify -CAfile cert-chain.pem ./signed_out/SharpHound.exe
          
          # Verify FETCH.ps1 with PowerShell
          echo "Verifying FETCH.ps1 signature..."
          pwsh -Command "Get-AuthenticodeSignature -FilePath ./signed_out/FETCH.ps1 | Format-List"
